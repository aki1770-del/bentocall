[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bentocall"
version = "0.1.0"
description = "Recursive long-context LLM calls in lunchbox shape — cheaper than one big call when the model would drift on long context."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "bentocall contributors" },
]
keywords = ["llm", "anthropic", "claude", "long-context", "recursion", "lambda-rlm", "openrouter", "haiku"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/aki1770-del/bentocall"
Issues = "https://github.com/aki1770-del/bentocall/issues"
Discussions = "https://github.com/aki1770-del/bentocall/discussions"

[project.scripts]
bentocall = "bentocall.cli:main"
bentocall-usage = "bentocall.usage:main"

[tool.hatch.build.targets.wheel]
packages = ["bentocall"]
