name: Mark stale issues

on:
  schedule:
    - cron: "0 12 * * 1"  # weekly Monday noon UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-issue-stale: 30
          days-before-issue-close: 7
          stale-issue-label: "stale"
          stale-issue-message: |
            This issue has been inactive for 30 days. It will be auto-closed in 7 days unless a comment lands explaining why it should stay open.

            If you still need this, add a brief update — what you've tried since, current reproduction status, or whether it's resolved on your end. If you're not sure whether to keep it open, it can be safely closed; we can always reopen if it comes back.

            (Auto-close is part of the project's [maintenance posture](https://github.com/aki1770-del/bentocall/blob/main/README.md#maintenance-posture).)
          close-issue-message: "Closed automatically after 30 + 7 days of inactivity. Reopen if still relevant."
          days-before-pr-stale: 60
          days-before-pr-close: 14
          stale-pr-label: "stale"
          stale-pr-message: |
            This PR has been inactive for 60 days. It will be auto-closed in 14 days unless a rebase, review response, or comment lands.
          close-pr-message: "Closed automatically after 60 + 14 days of inactivity. Feel free to reopen with a rebase."
          exempt-issue-labels: "pinned,security"
          exempt-pr-labels: "pinned,security,wip"
